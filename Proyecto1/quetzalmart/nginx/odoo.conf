# nginx -> Odoo (modo multihilo: HTTP y websocket en odoo:8069)
upstream qm_odoo {
    server odoo:8069;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64m;          # subir documentos/imágenes grandes
    proxy_read_timeout    720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout    720s;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;

    # Notificaciones en tiempo real (bus / chat / discuss)
    location /websocket {
        proxy_pass http://qm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://qm_odoo;
        proxy_redirect off;
    }

    # El gestor de bases queda solo disponible si ODOO_LIST_DB=True.
    # Recomendado: después de la carga inicial poner ODOO_LIST_DB=False.

    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/javascript application/json;
}
